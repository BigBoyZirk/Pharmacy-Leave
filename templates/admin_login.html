{% extends "base.html" %}
{% block title %}Admin login{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-1">Admin dashboard</h1>
        <p class="text-muted small mb-4">Password-protected. Staff should use the PIN portal.</p>
        <form method="post">
          <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" id="email" name="email" type="email" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" id="password" name="password" type="password" required>
          </div>
          <button class="btn btn-teal w-100" type="submit">Log in</button>
        </form>
        <a class="small d-block mt-3" href="{{ url_for('staff_login') }}">Staff login</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
