<form method="POST" action="{{ url_for('staff_login') }}">
  <div class="mb-3">
      <label class="form-label">Select Your Pharmacy</label>
      <select name="pharmacy_id" class="form-select" required>
          <option value="">-- Choose --</option>
          {% for pharmacy in pharmacies %}
          <option value="{{ pharmacy.id }}">{{ pharmacy.name }}</option>
          {% endfor %}
      </select>
  </div>
  <div class="mb-3">
      <label class="form-label">Your 4-Digit PIN</label>
      <input type="password" name="pin" class="form-control" maxlength="4" required>
  </div>
  <button type="submit" class="btn btn-primary w-100">Login</button>
</form>
