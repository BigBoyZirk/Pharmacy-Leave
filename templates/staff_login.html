{% extends "base.html" %}
{% block title %}Staff login{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-1">Staff portal</h1>
        <p class="text-muted small mb-4">Enter your 4-digit PIN. No password needed.</p>
        <form method="post">
          <label class="form-label" for="pin">PIN or employee ID</label>
          <input class="form-control form-control-lg text-center fs-3 letter-spacing"
                 id="pin" name="pin" inputmode="numeric" maxlength="4" pattern="[0-9]{4}"
                 autocomplete="one-time-code" required>
          <button class="btn btn-teal w-100 mt-3" type="submit">Log in</button>
        </form>
        <p class="small text-muted mt-3 mb-0">Demo PINs: 1001, 1002, 1003</p>
        <a class="small d-block mt-2" href="{{ url_for('admin_login') }}">Admin login</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
