{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <ul class="nav nav-tabs nav-justified mb-3" id="loginTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="staff-tab" data-bs-toggle="tab" data-bs-target="#staff-login" type="button" role="tab">Staff Login</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="admin-tab" data-bs-toggle="tab" data-bs-target="#admin-login" type="button" role="tab">Admin Login</button>
                    </li>
                </ul>

                <div class="tab-content">
                    <!-- STAFF LOGIN -->
                    <div class="tab-pane fade show active" id="staff-login" role="tabpanel">
                        <form method="POST" action="{{ url_for('staff_login') }}">
                            <div class="mb-3">
                                <label class="form-label">Select Your Pharmacy</label>
                                <select name="pharmacy_id" class="form-select" required>
                                    <option value="">-- Choose --</option>
                                    {% for pharmacy in pharmacies %}
                                    <option value="{{ pharmacy.id }}">{{ pharmacy.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Your 4-Digit PIN</label>
                                <input type="password" name="pin" class="form-control" maxlength="4" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Login</button>
                        </form>
                    </div>

                    <!-- ADMIN LOGIN -->
                    <div class="tab-pane fade" id="admin-login" role="tabpanel">
                        <form method="POST" action="{{ url_for('admin_login') }}">
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" name="email" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" name="password" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Login</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
