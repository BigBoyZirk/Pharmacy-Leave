{% extends "base.html" %}
{% block title %}Edit Pharmacy{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <h2 class="h4">Edit Pharmacy</h2>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Pharmacy Name</label>
                        <input type="text" name="name" class="form-control" value="{{ pharmacy.name }}" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <a href="{{ url_for('president_dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
